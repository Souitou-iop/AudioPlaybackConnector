name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g., v1.0-beta)'
        required: false
        default: 'v1.0-beta'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: latest

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate translation resources
      run: |
        cd translate
        pip install -r requirements.txt
        python ./po2ymo.py ./source/zh_CN.po ./generated/zh_CN.ymo
        python ./po2ymo.py ./source/zh_TW.po ./generated/zh_TW.ymo
        ./gen_rc.sh
      shell: bash

    - name: Restore NuGet packages
      run: nuget restore AudioPlaybackConnector.sln

    - name: Build All Architectures
      run: |
        msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x64 -m
        msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x86 -m
        msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=ARM64 -m
        msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=ARM -m
      shell: cmd

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector-Binaries
        path: |
          x64/Release/AudioPlaybackConnector64.exe
          x64/Release/AudioPlaybackConnector64.pdb
          Release/AudioPlaybackConnector32.exe
          Release/AudioPlaybackConnector32.pdb
          ARM64/Release/AudioPlaybackConnectorARM64.exe
          ARM64/Release/AudioPlaybackConnectorARM64.pdb
          ARM/Release/AudioPlaybackConnectorARM.exe
          ARM/Release/AudioPlaybackConnectorARM.pdb

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: AudioPlaybackConnector ${{ github.event.inputs.tag_name || github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          x64/Release/AudioPlaybackConnector64.exe
          Release/AudioPlaybackConnector32.exe
          ARM64/Release/AudioPlaybackConnectorARM64.exe
          ARM/Release/AudioPlaybackConnectorARM.exe
