name: Build and Release

on:
  push:
    tags:
      - 'v*'
      - '**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g., v1.0-beta4)'
        required: false
        default: 'v1.0-beta4'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2
      with:
        nuget-version: latest

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Generate translation resources
      run: python translate/po2ymo.py
      shell: cmd

    - name: Restore NuGet packages
      run: nuget restore AudioPlaybackConnector.sln

    - name: Build x64
      run: msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=x64 -m
      shell: cmd

    - name: Build ARM64
      run: msbuild AudioPlaybackConnector.sln -p:Configuration=Release -p:Platform=ARM64 -m
      shell: cmd

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AudioPlaybackConnector-Binaries
        path: |
          x64/Release/AudioPlaybackConnector64.exe
          x64/Release/AudioPlaybackConnector64.pdb
          ARM64/Release/AudioPlaybackConnectorARM64.exe
          ARM64/Release/AudioPlaybackConnectorARM64.pdb
        if-no-files-found: ignore

    - name: Extract Release Notes from CHANGELOG
      id: extract_notes
      run: |
        python -c "
        import re, os
        tag = '${{ github.event.inputs.tag_name || github.ref_name }}'
        notes = ''
        if os.path.exists('CHANGELOG.md'):
            with open('CHANGELOG.md', 'r', encoding='utf-8') as f:
                content = f.read()
            pattern = r'## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=\n## \[|\Z)'
            match = re.search(pattern, content, re.DOTALL)
            if match:
                notes = match.group(1).strip()
        if not notes:
            notes = '### Release ' + tag + '\n\n- Standalone binaries for x64 and ARM64'
        with open('RELEASE_NOTES.md', 'w', encoding='utf-8') as out:
            out.write(notes)
        "
      shell: cmd

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        name: AudioPlaybackConnector ${{ github.event.inputs.tag_name || github.ref_name }}
        draft: false
        prerelease: false
        body_path: RELEASE_NOTES.md
        files: |
          x64/Release/AudioPlaybackConnector64.exe
          ARM64/Release/AudioPlaybackConnectorARM64.exe
